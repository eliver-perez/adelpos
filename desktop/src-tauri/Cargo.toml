[package]
name = "ad-el-pos-desktop"
version = "0.9.4"
edition = "2021"
rust-version = "1.99"
description = "Terminal de escritorio para el servidor local"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }

tokio = { version = "=1.54.1", features = ["time"] }
# Diálogo nativo «Guardar como» de la exportación de reportes (etapa 9A), usado solo desde Rust.
tauri-plugin-dialog = "=2.8.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
