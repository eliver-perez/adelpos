[[permission]]
identifier = "allow-diagnostics"
description = "Consultar diagnósticos, operaciones API enumeradas, exportar reportes y recibir y habilitar las opciones del menú nativo, con credenciales custodiadas por Rust."
commands.allow = ["connection_config", "server_snapshot", "authentication_state", "api_request", "window_fullscreen_state", "window_set_fullscreen", "events_start", "events_stop", "export_report", "menu_subscribe", "menu_set_state"]
