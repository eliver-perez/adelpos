[[permission]]
identifier = "allow-diagnostics"
description = "Consultar diagnósticos, operaciones API enumeradas, exportar reportes, recibir y habilitar las opciones del menú nativo, elegir la modalidad de la computadora y la carpeta de los respaldos con el diálogo nativo (lista cerrada), emparejar esta terminal con la computadora principal (dirección validada en Rust y huella fijada), buscarla en la red local (lista que conserva Rust) y migrar del sistema anterior (archivos elegidos con los diálogos nativos, lector con una línea de órdenes fija, subida por partes e informe en PDF; etapa 9H), con credenciales custodiadas por Rust."
commands.allow = ["connection_config", "server_snapshot", "authentication_state", "api_request", "window_fullscreen_state", "window_set_fullscreen", "events_start", "events_stop", "export_report", "menu_subscribe", "menu_set_state", "installation_state", "set_installation_mode", "restart_application", "pairing_start", "pairing_status", "pairing_rename", "pairing_cancel", "pairing_forget", "choose_backup_directory", "pairing_start_found", "discovery_search", "legacy_choose_backup", "legacy_choose_package_output", "legacy_choose_package", "legacy_selection", "legacy_prepare_start", "legacy_prepare_watch", "legacy_prepare_cancel", "legacy_prepare_cleanup", "legacy_upload_package", "legacy_upload_cancel", "legacy_save_report"]
