# Gradle de la aplicación de cocina de AD-EL POS (etapa K1): los mismos valores que android/.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Versión de la aplicación de cocina: este es el único lugar donde se escribe. La usan versionName y versionCode del
# APK y la cabecera X-Client-Version que la aplicación envía al servidor en cada petición (BuildConfig.VERSION_NAME).
adelpos.versionName=0.1.0
adelpos.versionCode=1
